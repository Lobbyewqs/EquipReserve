<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EquipReserve · 设备预约</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><div id="login" class="login-shell"><section class="welcome"><div class="brand">▦ EquipReserve</div><p class="eyebrow">让好设备，流动起来</p><h1>下一次创作，<br>从这里开始。</h1><p>相机、开发板、音频与演示设备。<br>查看空闲时段，安排你的下一次使用。</p><div class="hero-art"><span>◎</span><div>共享设备 / 无限可能</div></div><small>学校社团 · 小型实验室</small></section><section class="login-form"><div><p class="eyebrow">欢迎回来</p><h2>登录设备工作台</h2><p class="muted">用你的账号查看预约与借还记录。</p><form id="loginForm"><label>账号<input id="username" autocomplete="username" value="student" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">进入工作台 →</button></form><p id="loginError" role="alert"></p><div class="hint">本地演示账号：student / student2 / admin<br>使用首次启动时设置的密码。</div></div></section></div>
<div id="app" hidden><aside><div class="brand">▦ EquipReserve</div><p class="nav-label">工作空间</p><nav><button data-page="devices" class="active">▦ 设备中心</button><button data-page="mine">◷ 我的预约</button><button data-page="admin" class="admin-only">▤ 借还管理</button><button data-page="audit" class="admin-only">≡ 操作记录</button></nav><div class="aside-bottom"><span id="userName"></span><small id="userRole"></small><button id="logout">退出登录 ↗</button></div></aside><main><header><span>工作空间 <span class="muted">/</span> <span id="breadcrumb">设备中心</span></span><span class="local-badge">● 本地工作台</span></header><div id="content"></div></main></div>
<dialog id="detail"><button id="closeDetail" class="close" aria-label="关闭">×</button><div id="detailBody"></div></dialog><div id="toast" role="status" hidden></div></body></html>
